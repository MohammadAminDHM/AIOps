name: ai-devops-demo

on:
  workflow_dispatch:

jobs:
  documentation-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify markdown files are present
        run: |
          test -f README.md
          test -f README.en.md
          test -d sections
          test -d projects
